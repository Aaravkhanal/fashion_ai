<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUЯA® | Digital Mirror</title>
    <meta name="description" content="AI-powered virtual try-on fitting room with biometric mapping and neural style curation.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <link rel="stylesheet" href="global.css">

    <style>
        /* ── Mirror Frame ── */
        .mirror-container {
            position: relative;
            width: 480px; height: 720px;
            border: 1px solid var(--gold);
            margin: 0 auto;
            background: #0a0a0a;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(212,175,55,0.1), 0 0 120px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #three-canvas { width: 100%; height: 100%; position: absolute; inset: 0; z-index: 5; }

        /* ── VTON Loader & Gold Laser ── */
        #vton-loader {
            position: absolute; inset: 0;
            background: rgba(26,26,26,0.85);
            z-index: 100; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .scan-line {
            width: 100%; height: 2px;
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold), 0 0 30px var(--gold);
            position: absolute; top: 0; left: 0;
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* ── Closet Sidebar ── */
        .closet-sidebar {
            width: 380px; height: calc(100vh - 100px);
            overflow-y: auto; padding: 2rem;
            position: fixed; left: 0; top: 80px; z-index: 20;
            background: rgba(26,26,26,0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(212,175,55,0.1);
        }

        /* ── Right Panel ── */
        .sidebar-right {
            width: 300px; height: calc(100vh - 100px);
            overflow-y: auto; padding: 2rem;
            position: fixed; right: 0; top: 80px; z-index: 20;
            background: rgba(26,26,26,0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(212,175,55,0.1);
        }

        /* ── Parallax BG ── */
        .bg-canvas-container {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; opacity: 0.25;
        }
    </style>
</head>
<body class="antialiased">

    <!-- Parallax BG -->
    <div class="bg-canvas-container" id="parallax-bg"></div>

    <header id="main-header" class="scrolled">
        <a href="index.html" class="logo">AUЯA<span>®</span></a>
        <div class="nav-links ml-auto mr-12">
            <a href="index.html#men">Men</a>
            <a href="index.html#women">Women</a>
            <a href="index.html#junior">Kids</a>
        </div>
        <a href="index.html" class="gold-link">Exit Mirror</a>
    </header>

    <main class="pt-24 pb-20 px-12 min-h-screen flex items-center justify-center relative">

        <!-- LEFT: Pinterest Closet -->
        <aside class="closet-sidebar hidden md:block">
            <h2 class="text-2xl font-bold mb-2 serif">Your <span class="italic text-[#D4AF37]">Closet</span></h2>
            <p class="text-[9px] uppercase tracking-widest text-white/30 mb-8">Select a garment to dress your avatar</p>
            <div class="flex gap-2 mb-6">
                <input type="text" id="pinterest-search" placeholder="Search trends..." class="input-gold flex-1">
                <button id="search-trigger" class="btn-gold !py-2 !px-4 !text-[10px]">Search</button>
            </div>
            <div id="closet-grid" class="masonry-grid">
                <p class="text-[10px] uppercase tracking-widest opacity-40 col-span-2">Loading curated archive...</p>
            </div>
        </aside>

        <!-- CENTER: Digital Mirror -->
        <section class="mirror-container" id="digital-mirror">
            <!-- VTON Loading Overlay -->
            <div id="vton-loader">
                <div class="scan-line"></div>
                <p class="status-text mt-40 text-center px-8">Crafting your bespoke digital fit...</p>
            </div>

            <!-- Result Mirror Image -->
            <img id="vton-result" class="absolute inset-0 w-full h-full object-cover hidden z-20" alt="Virtual try-on result">

            <!-- Base User Photo -->
            <img id="base-user-photo" class="absolute inset-0 w-full h-full object-cover hidden z-10" alt="Base portrait">

            <!-- Initial Upload Overlay -->
            <div id="scan-init-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-30">
                <div class="w-16 h-16 border border-[#D4AF37]/30 rounded-full flex items-center justify-center mb-6">
                    <span class="text-[#D4AF37] animate-pulse text-2xl">◇</span>
                </div>
                <h3 class="text-xl font-bold serif text-white mb-2">Initialize Mirror</h3>
                <p class="text-[10px] uppercase tracking-widest text-[#D4AF37]/60 text-center px-12 mb-8">Upload a portrait to begin your AI dressing session.</p>
                <label class="btn-gold !py-3 !px-8 !text-[10px] cursor-pointer">
                    Upload Photo
                    <input type="file" id="user-photo-upload" class="hidden" accept="image/*">
                </label>
            </div>
        </section>

        <!-- RIGHT: Settings -->
        <aside class="sidebar-right hidden lg:block">
            <h2 class="text-2xl font-bold mb-8 serif">Settings</h2>

            <div class="space-y-8">
                <div>
                    <label class="text-[9px] uppercase tracking-widest opacity-50 mb-2 block">Height (cm)</label>
                    <input type="number" id="height-input" value="178" class="input-gold">
                </div>
                <div>
                    <label class="text-[9px] uppercase tracking-widest opacity-50 mb-2 block">Weight (kg)</label>
                    <input type="number" id="weight-input" value="72" class="input-gold">
                </div>

                <div class="pt-8 border-t border-white/10">
                    <button id="reset-look" class="gold-link block mb-4">Reset Outfit</button>
                    <button id="download-look" class="gold-link block">Save Portrait</button>
                </div>

                <div class="mt-20">
                    <p class="text-[9px] uppercase tracking-widest text-[#D4AF37]/60 mb-2">Mirror Mode</p>
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-[#D4AF37] animate-pulse"></div>
                        <span class="text-[10px] mono">IDM-VTON Neural Engine Active</span>
                    </div>
                </div>
            </div>
        </aside>

    </main>

    <script type="module">
        // Removed Three.js import

        const loader = document.getElementById('vton-loader');
        const vtonResult = document.getElementById('vton-result');
        const basePhotoEl = document.getElementById('base-user-photo');
        const initOverlay = document.getElementById('scan-init-overlay');

        let userImageBase64 = null;
        let isVtonActive = false;

        // 3D Scene Initialization Removed

        // Load saved biometrics
        const savedBio = localStorage.getItem('aura_biometrics');
        const savedH = localStorage.getItem('aura_height');
        const savedW = localStorage.getItem('aura_weight');
        if (savedH) document.getElementById('height-input').value = savedH;
        if (savedW) document.getElementById('weight-input').value = savedW;

        const savedFace = localStorage.getItem('aura_face_scan');
        if (savedFace) {
            userImageBase64 = savedFace;
            basePhotoEl.src = userImageBase64;
            basePhotoEl.classList.remove('hidden');
            initOverlay.classList.add('hidden');
        }

        // ── Pinterest Archive ──
        async function fetchArchive(query = "luxury minimalist fashion") {
            const grid = document.getElementById('closet-grid');
            try {
                const res = await fetch(`http://localhost:3000/api/pinterest?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                grid.innerHTML = '';

                data.images.slice(0, 12).forEach(img => {
                    const item = document.createElement('div');
                    item.className = 'masonry-item';
                    item.innerHTML = `<img src="${img}" class="w-full h-auto" loading="lazy">`;
                    item.onclick = () => tryOnGarment(img);
                    grid.appendChild(item);
                });
            } catch (e) {
                grid.innerHTML = '<p class="text-[10px] text-[#D4AF37]/60">Archive connection pending. Start server first.</p>';
            }
        }

        // ── Virtual Try-On ──
        async function tryOnGarment(garmentUrl) {
            if (!userImageBase64) {
                alert("Please upload your portrait first to initialize the mirror.");
                return;
            }

            loader.style.display = 'flex';
            isVtonActive = true;

            try {
                const response = await fetch('http://localhost:3000/api/try-on', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userImage: userImageBase64,
                        garmentImage: garmentUrl
                    })
                });

                const data = await response.json();

                if (data.imageUrl) {
                    vtonResult.src = data.imageUrl;
                    vtonResult.classList.remove('hidden');
                    basePhotoEl.classList.add('hidden');
                }
            } catch (err) {
                console.error("VTON failed:", err);
                alert("The AI Mirror is processing. Please try again in a moment.");
            } finally {
                loader.style.display = 'none';
            }
        }

        // ── User Photo Upload ──
        document.getElementById('user-photo-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                userImageBase64 = event.target.result;
                basePhotoEl.src = userImageBase64;
                basePhotoEl.classList.remove('hidden');
                localStorage.setItem('aura_face_scan', userImageBase64);
                initOverlay.classList.add('hidden');

                // Trigger biometric scan
                fetch('http://localhost:3000/api/generate-biometrics', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: userImageBase64 })
                }).then(r => r.json()).then(data => {
                    if (data.biometrics) {
                        localStorage.setItem('aura_biometrics', JSON.stringify(data.biometrics));
                    }
                });
            };
            reader.readAsDataURL(file);
        });

        // ── Parallax ──
        window.addEventListener('scroll', () => {
            gsap.to('#parallax-bg', { y: window.scrollY * 0.4, duration: 0.5, ease: "power1.out" });
        });

        // ── Search ──
        document.getElementById('search-trigger').onclick = () => {
            fetchArchive(document.getElementById('pinterest-search').value);
        };
        document.getElementById('pinterest-search').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') fetchArchive(e.target.value);
        });

        document.getElementById('reset-look').onclick = () => {
            vtonResult.classList.add('hidden');
            basePhotoEl.classList.remove('hidden');
        };

        // ── Download ──
        document.getElementById('download-look').onclick = () => {
            if (vtonResult.src && !vtonResult.classList.contains('hidden')) {
                const a = document.createElement('a');
                a.href = vtonResult.src;
                a.download = 'outfit-mirror-result.png';
                a.click();
            }
        };

        // ── Init ──
        // Handle ?query= URL param to auto-search
        const urlParams = new URLSearchParams(window.location.search);
        const autoQuery = urlParams.get('style');
        if (autoQuery) {
            document.getElementById('pinterest-search').value = autoQuery;
            fetchArchive(autoQuery);
        } else {
            fetchArchive();
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
            gsap.from('#digital-mirror', { scale: 0.9, opacity: 0, duration: 1.5, ease: "power4.out" });
        });
    </script>
</body>
</html>
