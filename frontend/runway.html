<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUЯA | Runway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00f2fe;
            --neon-violet: #8a2be2;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030303; 
            color: #ffffff; 
            overflow-x: hidden; 
        }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        .mesh-bg { 
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; 
            background: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.08), transparent 50%), radial-gradient(circle at 80% 20%, rgba(138, 43, 226, 0.08), transparent 50%); 
            z-index: -1; animation: rotateBg 40s linear infinite; 
        }
        @keyframes rotateBg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        * { cursor: none !important; }
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 16px; height: 16px; border-radius: 50%; pointer-events: none; z-index: 9999;
            background: var(--neon-cyan); box-shadow: 0 0 12px var(--neon-cyan), 0 0 30px var(--neon-cyan); mix-blend-mode: screen; transform: translate(-50%, -50%);
        }
        .cursor-ring {
            position: fixed; top: 0; left: 0; width: 40px; height: 40px; border-radius: 50%; pointer-events: none; z-index: 9998;
            border: 1px solid rgba(255,255,255,0.15); transform: translate(-50%, -50%);
        }

        /* Filter Pills */
        .filter-pill {
            padding: 0.5rem 1.5rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .filter-pill.active, .filter-pill:hover {
            background: var(--neon-cyan);
            color: black;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0,242,254,0.4);
        }
        .filter-scroll::-webkit-scrollbar { display: none; }

        /* Masonry Grid */
        .masonry-grid {
            column-count: 1;
            column-gap: 1.5rem;
        }
        @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1280px) { .masonry-grid { column-count: 4; } }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            position: relative;
            border-radius: 1.5rem;
            overflow: hidden;
            transform: translateZ(0); /* For performance */
        }

        /* Hover Physics */
        .masonry-item img {
            width: 100%; height: auto; display: block;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), filter 0.8s ease;
        }
        .masonry-item:hover img {
            transform: scale(1.08);
            filter: brightness(0.6);
        }

        .item-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.2); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            opacity: 0; transition: opacity 0.4s ease; display: flex; flex-direction: column; justify-content: space-between; padding: 1.5rem;
        }
        .masonry-item:hover .item-overlay { opacity: 1; }

        .try-look-btn {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-violet));
            border-radius: 999px; padding: 0.75rem 1.5rem; font-weight: bold; color: white;
            box-shadow: 0 0 20px rgba(0,242,254,0.3);
            transform: translateY(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-block; text-align: center;
        }
        .masonry-item:hover .try-look-btn { transform: translateY(0); opacity: 1; transition-delay: 0.1s; }
        .try-look-btn:hover { box-shadow: 0 0 30px rgba(0,242,254,0.6); scale: 1.05; color: white; }

        .item-icons {
            display: flex; gap: 0.5rem;
            transform: translateY(-20px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .masonry-item:hover .item-icons { transform: translateY(0); opacity: 1; transition-delay: 0.1s; }
        
        .icon-circle {
            width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
    </style>
</head>
<body class="antialiased">
    <div class="mesh-bg"></div>
    <div class="custom-cursor" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <nav class="fixed w-full top-0 z-50 glass border-b-0 border-white/10 px-8 py-4 flex justify-between items-center transition-all duration-300">
        <a href="index.html" class="text-2xl font-bold tracking-widest">AUЯA<span class="text-[#00f2fe]">.</span></a>
        <div class="space-x-4">
            <a href="dashboard.html" class="text-sm font-medium text-gray-300 hover:text-white transition">Dashboard</a>
            <a href="ai-stylist.html" class="text-sm font-medium text-gray-300 hover:text-white transition">AI Stylist</a>
            <a href="fitting-room.html" class="text-sm font-medium text-gray-300 hover:text-white transition">Fitting Room</a>
        </div>
    </nav>

    <main class="pt-28 pb-20 px-6 max-w-[1600px] mx-auto">
        <div class="text-center mb-10 gsap-fade-up">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Runway <span class="serif italic">Community.</span></h1>
            <p class="text-gray-400">Explore community generated looks and try them on instantly.</p>
        </div>

        <!-- Filter Menu -->
        <div class="flex overflow-x-auto filter-scroll gap-4 pb-4 mb-10 justify-start md:justify-center px-4 gsap-fade-up">
            <button class="filter-pill active" data-filter="all">All Looks</button>
            <button class="filter-pill" data-filter="trending">Trending</button>
            <button class="filter-pill" data-filter="cyberpunk">Cyberpunk</button>
            <button class="filter-pill" data-filter="minimalist">Minimalist</button>
            <button class="filter-pill" data-filter="streetwear">Streetwear</button>
        </div>

        <!-- Masonry Grid -->
        <div class="masonry-grid" id="runway-grid">
            <!-- Items injected by JS -->
        </div>
    </main>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Custom Cursor
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        window.addEventListener('mousemove', (e) => {
            gsap.to(dot, { x: e.clientX, y: e.clientY, duration: 0.15, ease: 'power2.out' });
            gsap.to(ring, { x: e.clientX, y: e.clientY, duration: 0.35, ease: 'power2.out' });
        });
        document.querySelectorAll('a, button, .masonry-item').forEach(el => {
            el.addEventListener('mouseenter', () => { gsap.to(dot, { scale: 1.5, duration: 0.3 }); gsap.to(ring, { scale: 1.6, opacity: 0.5, duration: 0.3 }); });
            el.addEventListener('mouseleave', () => { gsap.to(dot, { scale: 1, duration: 0.3 }); gsap.to(ring, { scale: 1, opacity: 1, duration: 0.3 }); });
        });

        const imageData = [
            { src: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600&auto=format&fit=crop", cat: "minimalist", icons: ["🧥", "👜"] },
            { src: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=600&auto=format&fit=crop", cat: "trending", icons: ["👗", "👠", "🕶️"] },
            { src: "https://images.unsplash.com/photo-1492288991661-058aa541ff43?w=600&auto=format&fit=crop", cat: "minimalist", icons: ["👕", "👖"] },
            { src: "https://images.unsplash.com/photo-1550614000-4b95d4662d57?w=600&auto=format&fit=crop", cat: "cyberpunk", icons: ["🧥", "🕶️", "🥾"] },
            { src: "https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=600&auto=format&fit=crop", cat: "streetwear", icons: ["👕", "👟"] },
            { src: "https://images.unsplash.com/photo-1511511450040-677116ff389e?w=600&auto=format&fit=crop", cat: "streetwear", icons: ["🧥", "👖", "👟"] },
            { src: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop", cat: "trending", icons: ["👗", "💎"] },
            { src: "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600&auto=format&fit=crop", cat: "minimalist", icons: ["🧥", "👖"] },
            { src: "https://images.unsplash.com/photo-1617137968427-85924c800a22?w=600&auto=format&fit=crop", cat: "minimalist", icons: ["🧥", "👔"] },
            { src: "https://images.unsplash.com/photo-1583316174775-bd6dc0e9f298?w=600&auto=format&fit=crop", cat: "cyberpunk", icons: ["🧥", "👖", "🥾"] },
            { src: "https://images.unsplash.com/photo-1483985988355-763728e1935b?w=600&auto=format&fit=crop", cat: "trending", icons: ["🧥", "👢"] },
            { src: "https://images.unsplash.com/photo-1523381294911-8d3cead13475?w=600&auto=format&fit=crop", cat: "streetwear", icons: ["👕", "🧢"] }
        ];

        const grid = document.getElementById('runway-grid');

        function renderGrid(filter = 'all') {
            grid.innerHTML = '';
            let filtered = imageData;
            if (filter !== 'all') {
                filtered = imageData.filter(img => img.cat === filter);
            }

            filtered.forEach((item, i) => {
                const el = document.createElement('div');
                el.className = 'masonry-item gsap-grid-item opacity-0 translate-y-10';
                
                let iconsHtml = item.icons.map(ic => `<div class="icon-circle">${ic}</div>`).join('');
                
                el.innerHTML = `
                    <img src="${item.src}" alt="Fashion Look" loading="lazy">
                    <div class="item-overlay">
                        <div class="item-icons">
                            ${iconsHtml}
                        </div>
                        <div class="flex justify-center w-full pb-4">
                            <a href="fitting-room.html" class="try-look-btn cursor-none">✨ Try this Look</a>
                        </div>
                    </div>
                `;
                grid.appendChild(el);
            });

            // Re-bind cursor events for new elements
            document.querySelectorAll('.masonry-item').forEach(el => {
                el.addEventListener('mouseenter', () => { gsap.to(dot, { scale: 1.5, duration: 0.3 }); gsap.to(ring, { scale: 1.6, opacity: 0.5, duration: 0.3 }); });
                el.addEventListener('mouseleave', () => { gsap.to(dot, { scale: 1, duration: 0.3 }); gsap.to(ring, { scale: 1, opacity: 1, duration: 0.3 }); });
            });

            // Entry Animations
            ScrollTrigger.batch(".gsap-grid-item", {
                onEnter: batch => gsap.to(batch, { opacity: 1, y: 0, stagger: 0.1, duration: 0.8, ease: "power3.out" }),
                once: true
            });
            ScrollTrigger.refresh();
        }

        renderGrid();

        // Filtering Logic
        document.querySelectorAll('.filter-pill').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                renderGrid(e.target.getAttribute('data-filter'));
            });
        });

        // Header Animations
        gsap.from(".gsap-fade-up", { y: 30, opacity: 0, duration: 1, stagger: 0.2, ease: "power3.out" });

    </script>
</body>
</html>
