<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUTFIT® | Runway Archive</title>
    <meta name="description" content="Curated global fashion archive. Try on looks from the runway with AI virtual dressing.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="global.css">
    <style>
        .runway-grid { column-count: 1; column-gap: 2rem; }
        @media (min-width: 640px) { .runway-grid { column-count: 2; } }
        @media (min-width: 1024px) { .runway-grid { column-count: 3; } }
        @media (min-width: 1280px) { .runway-grid { column-count: 4; } }

        .runway-item {
            break-inside: avoid; margin-bottom: 2rem;
            position: relative; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            transition: var(--transition-luxury);
        }
        .runway-item img {
            width: 100%; height: auto; display: block;
            transition: transform 1.2s cubic-bezier(0.25,1,0.5,1), filter 0.8s ease;
        }
        .runway-item:hover img {
            transform: scale(1.03);
            filter: brightness(0.5);
        }
        .item-overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.6s ease;
        }
        .runway-item:hover .item-overlay { opacity: 1; }
        .runway-item:hover { border-color: var(--border-gold); }

        .filter-btn {
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em;
            color: var(--text-light); opacity: 0.4;
            transition: var(--transition-smooth);
            background: transparent; border: none; cursor: pointer;
            padding-bottom: 4px; border-bottom: 1px solid transparent;
        }
        .filter-btn:hover, .filter-btn.active {
            opacity: 1; color: var(--gold); border-bottom: 1px solid var(--gold);
        }

        /* VTON Modal */
        #vton-modal {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(26,26,26,0.95);
            backdrop-filter: blur(20px);
            display: none; align-items: center; justify-content: center;
            flex-direction: column;
        }
        #vton-modal.active { display: flex; }
        .modal-mirror {
            width: 420px; height: 630px;
            border: 1px solid var(--gold);
            position: relative; overflow: hidden;
            box-shadow: var(--shadow-gold);
        }
    </style>
</head>
<body class="antialiased">

    <header id="main-header" class="scrolled">
        <a href="index.html" class="logo">OUTFIT<span>®</span></a>
        <div class="nav-links ml-auto mr-12">
            <a href="fitting-room.html">Mirror</a>
            <a href="ai-stylist.html">Stylist</a>
            <a href="dashboard.html">Matrix</a>
        </div>
        <a href="index.html" class="gold-link">Home</a>
    </header>

    <!-- VTON Modal -->
    <div id="vton-modal">
        <div class="modal-mirror" id="modal-mirror">
            <div class="scan-line"></div>
            <img id="modal-result" class="w-full h-full object-cover hidden">
            <div id="modal-loading" class="absolute inset-0 flex flex-col items-center justify-center">
                <div class="scan-line"></div>
                <p class="status-text mt-40 text-center px-8">Crafting your bespoke digital fit...</p>
            </div>
        </div>
        <button id="close-modal" class="gold-link mt-8">Close Mirror</button>
    </div>

    <main class="pt-40 pb-20 px-8 max-w-[1600px] mx-auto">
        <div class="text-center mb-20 gsap-fade-up">
            <p class="text-[10px] uppercase tracking-[0.5em] text-[#D4AF37] mb-6">Style3D Catwalk</p>
            <h1 class="text-6xl md:text-8xl font-bold mb-6 serif">The <span class="italic text-[#D4AF37]">Archive.</span></h1>
            <p class="text-white/30 uppercase tracking-[0.2em] text-xs">Curated global aesthetics — click any look to dress your avatar</p>
        </div>

        <div class="flex flex-wrap justify-center gap-12 mb-20 gsap-fade-up">
            <button class="filter-btn active" data-filter="all">All Archive</button>
            <button class="filter-btn" data-filter="minimalist">Minimalist</button>
            <button class="filter-btn" data-filter="avant">Avant-Garde</button>
            <button class="filter-btn" data-filter="street">High Street</button>
        </div>

        <div class="runway-grid" id="runway-grid"></div>
    </main>

    <footer class="site-footer">
        <p class="text-[10px] uppercase tracking-[0.5em] text-white/20">© 2026 OUTFIT® Archive</p>
    </footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const imageData = [
            { src: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800&auto=format&fit=crop", cat: "minimalist" },
            { src: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=800&auto=format&fit=crop", cat: "avant" },
            { src: "https://images.unsplash.com/photo-1492288991661-058aa541ff43?w=800&auto=format&fit=crop", cat: "minimalist" },
            { src: "https://images.unsplash.com/photo-1550614000-4b95d4662d57?w=800&auto=format&fit=crop", cat: "street" },
            { src: "https://images.unsplash.com/photo-1552374196-1ab2a1c593e8?w=800&auto=format&fit=crop", cat: "street" },
            { src: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=800&auto=format&fit=crop", cat: "avant" },
            { src: "https://images.unsplash.com/photo-1509631179647-0177331693ae?w=800&auto=format&fit=crop", cat: "minimalist" },
            { src: "https://images.unsplash.com/photo-1617137968427-85924c800a22?w=800&auto=format&fit=crop", cat: "minimalist" }
        ];

        const grid = document.getElementById('runway-grid');
        const modal = document.getElementById('vton-modal');
        const modalResult = document.getElementById('modal-result');
        const modalLoading = document.getElementById('modal-loading');

        function renderGrid(filter = 'all') {
            grid.innerHTML = '';
            let filtered = filter === 'all' ? imageData : imageData.filter(i => i.cat === filter);

            filtered.forEach(item => {
                const el = document.createElement('div');
                el.className = 'runway-item gsap-grid-item opacity-0 translate-y-12';
                el.innerHTML = `
                    <img src="${item.src}" loading="lazy" alt="Fashion look">
                    <div class="item-overlay">
                        <button class="btn-gold !bg-black/60 backdrop-blur-sm try-on-btn" data-src="${item.src}">Drape This Look</button>
                    </div>
                `;
                grid.appendChild(el);
            });

            gsap.to(".gsap-grid-item", { opacity: 1, y: 0, stagger: 0.08, duration: 1, ease: "power3.out" });

            // Attach VTON handlers
            document.querySelectorAll('.try-on-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    tryOnFromRunway(btn.dataset.src);
                });
            });
        }

        // VTON from Runway
        async function tryOnFromRunway(garmentUrl) {
            const userImage = localStorage.getItem('aura_face_scan');
            if (!userImage) {
                alert("Please upload your portrait first via the Mirror or Home page scanner.");
                return;
            }

            modal.classList.add('active');
            modalResult.classList.add('hidden');
            modalLoading.style.display = 'flex';

            try {
                const response = await fetch('http://localhost:3000/api/try-on', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userImage, garmentImage: garmentUrl })
                });
                const data = await response.json();

                if (data.imageUrl) {
                    modalResult.src = data.imageUrl;
                    modalResult.classList.remove('hidden');
                    modalLoading.style.display = 'none';
                }
            } catch (err) {
                console.error("Runway VTON failed:", err);
                modalLoading.innerHTML = '<p class="status-text">Mirror temporarily unavailable.</p>';
            }
        }

        document.getElementById('close-modal').onclick = () => {
            modal.classList.remove('active');
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
            renderGrid();
            gsap.from(".gsap-fade-up", { y: 40, opacity: 0, duration: 1.5, stagger: 0.2, ease: "power4.out" });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    renderGrid(e.target.dataset.filter);
                });
            });
        });
    </script>
</body>
</html>
