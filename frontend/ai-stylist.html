<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUЯA | AI Stylist Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-cyan: #00f2fe;
            --neon-violet: #8a2be2;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030303; 
            color: #ffffff; 
            overflow: hidden; 
            height: 100vh;
        }
        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        .mesh-bg { 
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; 
            background: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.08), transparent 50%), radial-gradient(circle at 80% 20%, rgba(138, 43, 226, 0.08), transparent 50%); 
            z-index: -1; animation: rotateBg 40s linear infinite; 
        }
        @keyframes rotateBg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        * { cursor: none !important; }
        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 16px; height: 16px; border-radius: 50%; pointer-events: none; z-index: 9999;
            background: var(--neon-cyan); box-shadow: 0 0 12px var(--neon-cyan), 0 0 30px var(--neon-cyan); mix-blend-mode: screen; transform: translate(-50%, -50%);
        }
        .cursor-ring {
            position: fixed; top: 0; left: 0; width: 40px; height: 40px; border-radius: 50%; pointer-events: none; z-index: 9998;
            border: 1px solid rgba(255,255,255,0.15); transform: translate(-50%, -50%);
        }

        #chat-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            padding-bottom: 120px;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .bubble {
            width: fit-content;
            max-width: 80%;
            padding: 1rem 1.5rem;
            border-radius: 20px;
            margin-bottom: 1rem;
            position: relative;
            transform-origin: bottom left;
            /* Professional UI/UX Overhaul: Glassmorphism */
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.05);
        }
        .bubble-user {
            background: linear-gradient(135deg, rgba(138,43,226,0.2), rgba(0,242,254,0.2));
            border: 1px solid rgba(0,242,254,0.3);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            transform-origin: bottom right;
        }
        .bubble-ai {
            border: 1px solid rgba(0, 242, 254, 0.15);
            border-left: 3px solid var(--neon-cyan);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .typing-dot {
            width: 8px; height: 8px; background: var(--neon-cyan); border-radius: 50%; display: inline-block;
            animation: pulse 1.5s infinite ease-in-out both; margin: 0 2px;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px var(--neon-cyan); } }
        
        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 18px;
            background-color: var(--neon-cyan);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }

        .pill-input {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
        }
        .pill-input:focus-within { border-color: var(--neon-cyan); box-shadow: 0 0 30px rgba(0, 242, 254, 0.2); }
        
        .bento-card {
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .bento-card:hover {
            border-color: var(--neon-cyan); box-shadow: 0 0 20px rgba(0,242,254,0.15); transform: translateY(-5px);
        }
    </style>
</head>
<body class="antialiased flex flex-col">
    <div class="mesh-bg"></div>
    <div class="custom-cursor" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <nav class="w-full z-50 glass border-b-0 border-white/10 px-8 py-4 flex justify-between items-center transition-all duration-300">
        <a href="index.html" class="text-2xl font-bold tracking-widest">AUЯA<span class="text-[#00f2fe]">.</span></a>
        <div class="space-x-4">
            <a href="dashboard.html" class="text-sm font-medium text-gray-300 hover:text-white transition">Dashboard</a>
            <a href="fitting-room.html" class="text-sm font-medium text-gray-300 hover:text-white transition">Fitting Room</a>
            <a href="runway.html" class="text-sm font-medium text-gray-300 hover:text-white transition">Runway</a>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <div class="w-[280px] shrink-0 glass border-r border-white/10 flex flex-col p-6 hidden md:flex">
            <h3 class="text-lg font-bold mb-6 text-white border-b border-white/10 pb-4">Chat History</h3>
            <div id="history-list" class="space-y-4 overflow-y-auto flex-1 chat-container">
                <!-- History items will be loaded here -->
            </div>
            <button onclick="clearHistory()" class="mt-4 w-full py-3 rounded-xl glass text-sm font-semibold hover:bg-white/10 transition cursor-none text-red-400">
                Clear History
            </button>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col relative">
            <div id="chat-scroll-area" class="p-6 md:p-10 chat-container">
                <!-- Welcome Message is loaded dynamically or statically -->
                <div class="bubble bubble-ai flex flex-col gap-2">
                    <div class="flex items-center gap-3 border-b border-white/10 pb-2 mb-2">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-[var(--neon-cyan)] to-[var(--neon-violet)] flex items-center justify-center font-bold text-black text-xs">AI</div>
                        <span class="font-semibold">AUЯA System</span>
                    </div>
                    <p>Welcome back! I'm AUЯA, your personal AI stylist. Upload an image or just tell me your vibe.</p>
                </div>
            </div>

            <!-- Input Area -->
            <div style="position: absolute; bottom: 0; left: 0; right: 0;" class="p-6 bg-gradient-to-t from-[#030303] to-transparent pointer-events-none z-40">
                <div class="relative max-w-4xl mx-auto w-[90%]">
                    <!-- Image Preview Area -->
                    <img id="image-preview" src="" class="hidden absolute bottom-[110%] left-4 w-20 h-20 object-cover rounded-xl border border-white/20 shadow-lg">
                    
                    <form id="chat-form" class="pointer-events-auto flex gap-3 pill-input p-2 rounded-full items-center">
                        <label for="image-upload" class="cursor-none flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 transition text-xl text-gray-300 ml-2">
                            📷
                        </label>
                        <input type="file" id="image-upload" accept="image/*" class="hidden">
                        
                        <input type="text" id="chat-input" class="flex-1 bg-transparent border-none outline-none text-white px-2 py-3 placeholder-gray-500 cursor-none" placeholder="Ask AUЯA or upload an outfit photo...">
                        <button type="submit" class="bg-gradient-to-r from-[var(--neon-cyan)] to-[var(--neon-violet)] text-black w-12 h-12 rounded-full shrink-0 flex items-center justify-center hover:scale-105 transition-transform shadow-[0_0_15px_rgba(0,242,254,0.4)] cursor-none">
                            <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Custom Cursor
        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        window.addEventListener('mousemove', (e) => {
            gsap.to(dot, { x: e.clientX, y: e.clientY, duration: 0.15, ease: 'power2.out' });
            gsap.to(ring, { x: e.clientX, y: e.clientY, duration: 0.35, ease: 'power2.out' });
        });
        function bindCursorHover() {
            document.querySelectorAll('a, button, input, label, .bento-card').forEach(el => {
                if(el.dataset.hoverBound) return;
                el.dataset.hoverBound = "true";
                el.addEventListener('mouseenter', () => { gsap.to(dot, { scale: 1.5, duration: 0.3 }); gsap.to(ring, { scale: 1.6, opacity: 0.5, duration: 0.3 }); });
                el.addEventListener('mouseleave', () => { gsap.to(dot, { scale: 1, duration: 0.3 }); gsap.to(ring, { scale: 1, opacity: 1, duration: 0.3 }); });
            });
        }
        bindCursorHover();

        // Audio System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'click') {
                // Short deep click for user message
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'chime') {
                // Soft high chime for AI response
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        const chatContainer = document.getElementById('chat-scroll-area');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const historyList = document.getElementById('history-list');
        
        // Chat History Persistence
        let savedHistory = JSON.parse(localStorage.getItem('aura_chat_history') || '[]');
        
        function saveToHistory(text, role, image = null) {
            savedHistory.push({ text, role, image, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem('aura_chat_history', JSON.stringify(savedHistory));
            renderSidebarHistory();
        }
        
        function clearHistory() {
            localStorage.removeItem('aura_chat_history');
            savedHistory = [];
            renderSidebarHistory();
            chatContainer.innerHTML = '';
        }

        function renderSidebarHistory() {
            historyList.innerHTML = '';
            // Get just the user messages for the sidebar preview
            const userMessages = savedHistory.filter(msg => msg.role === 'user').reverse();
            userMessages.forEach(msg => {
                const el = document.createElement('div');
                el.className = "p-3 rounded-xl glass hover:bg-white/10 transition cursor-none opacity-50 mb-4";
                el.innerHTML = `
                    <p class="text-xs text-[var(--neon-cyan)] mb-1">${msg.time}</p>
                    <p class="text-sm text-white truncate">${msg.text || "📷 Image Upload"}</p>
                `;
                historyList.appendChild(el);
            });
            bindCursorHover();
        }

        // Restore chat history on load
        window.addEventListener('DOMContentLoaded', () => {
            if (savedHistory.length > 0) {
                // remove welcome message if there is history
                chatContainer.innerHTML = '';
                savedHistory.forEach(msg => {
                    let extraHtml = '';
                    if (msg.image) {
                        extraHtml += `<br><img src="${msg.image}" class="mt-2 rounded-xl border border-white/20 w-32 h-32 object-cover">`;
                    }
                    if (msg.role === 'ai') {
                        // Restore visualize button if we want, or just the text
                        let formattedReply = msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        formattedReply = formattedReply.replace(/\n/g, '<br>');
                        appendBubbleStatic(formattedReply, false, extraHtml);
                    } else {
                        appendBubbleStatic(msg.text, true, extraHtml);
                    }
                });
                renderSidebarHistory();
            }
        });

        // Image Upload Logic
        let currentImageBase64 = null;
        document.getElementById('image-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                currentImageBase64 = event.target.result;
                document.getElementById('image-preview').src = currentImageBase64;
                document.getElementById('image-preview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        function appendBubbleStatic(text, isUser = false, extraHtml = '') {
            const bubble = document.createElement('div');
            bubble.className = `bubble ${isUser ? 'bubble-user' : 'bubble-ai'}`;
            let content = '';
            if (!isUser) {
                content += `
                    <div class="flex items-center gap-3 border-b border-white/10 pb-2 mb-2">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-[var(--neon-cyan)] to-[var(--neon-violet)] flex items-center justify-center font-bold text-black text-xs">AI</div>
                        <span class="font-semibold">AUЯA System</span>
                    </div>
                `;
            }
            content += `<p>${text}</p>${extraHtml}`;
            bubble.innerHTML = content;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Visualize Look feature
        window.visualizeOutfit = async function(replyId, btnElement) {
            // Retrieve the full outfit text from the stored reference
            const outfitText = window[replyId] || replyId;

            const container = btnElement.parentElement;
            // Add a glowing neon progress bar
            container.innerHTML = `
                <div class="w-full mt-3">
                    <p class="text-xs text-[var(--neon-cyan)] mb-2 animate-pulse">✨ Neural Rendering... AUЯA is tailoring your new look</p>
                    <div class="h-1.5 bg-white/10 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-[var(--neon-cyan)] to-[var(--neon-violet)] shadow-[0_0_10px_var(--neon-cyan)] rounded-full animate-[progress_2s_ease-in-out_infinite]" style="width: 50%"></div>
                    </div>
                    <style>@keyframes progress { 0% { width: 5%; margin-left: 0; } 50% { width: 40%; margin-left: 55%; } 100% { width: 5%; margin-left: 95%; } }</style>
                </div>
            `;

            try {
                // Find the last uploaded image from chat history
                let lastUserImage = null;
                for (let i = savedHistory.length - 1; i >= 0; i--) {
                    if (savedHistory[i].role === 'user' && savedHistory[i].image) {
                        lastUserImage = savedHistory[i].image;
                        break;
                    }
                }

                if (!lastUserImage) {
                    container.innerHTML = `<p class="text-sm text-yellow-400 mt-2">📷 Upload a photo of yourself first so I can visualize the outfit on you!</p>`;
                    return;
                }

                const res = await fetch('http://localhost:3000/api/visualize-tryon', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: outfitText, image: lastUserImage })
                });
                
                if (!res.ok) throw new Error("API responded with " + res.status);
                const data = await res.json();
                
                if (!data.imageUrl) throw new Error("No image URL in response");
                
                // Clear the progress bar
                container.innerHTML = '';
                
                // Append the generated image directly into a new chat bubble
                const imgBubble = document.createElement('div');
                imgBubble.className = "bubble bubble-ai mt-2 opacity-0 translate-y-4";
                imgBubble.innerHTML = `
                    <div class="flex items-center gap-3 border-b border-white/10 pb-2 mb-2">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-[var(--neon-cyan)] to-[var(--neon-violet)] flex items-center justify-center font-bold text-black text-xs">AI</div>
                        <span class="font-semibold">AUЯA Virtual Try-On</span>
                    </div>
                    <img src="${data.imageUrl}" class="rounded-[15px] w-full max-w-lg shadow-lg border border-white/10" onload="gsap.to(this.closest('.bubble'), {opacity: 1, y: 0, duration: 0.6, ease: 'power2.out'}); chatContainer.scrollTo({top: chatContainer.scrollHeight, behavior: 'smooth'});">
                `;
                chatContainer.appendChild(imgBubble);
                chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                
                playSound('chime');
                
            } catch(e) {
                console.error("Visualize error:", e);
                container.innerHTML = `<p class="text-sm text-red-400 mt-2">Grid interference detected. I couldn't render the visual, but the style remains elite.</p>`;
            }
        };

        // Streaming HTML Typer
        function typeHTML(element, html, speed = 10) {
            return new Promise(resolve => {
                element.innerHTML = '';
                let i = 0;
                let isTag = false;
                let currentHTML = '';
                
                function typeChar() {
                    if (i < html.length) {
                        currentHTML += html.charAt(i);
                        element.innerHTML = currentHTML + '<span class="typing-cursor"></span>';
                        
                        if (html.charAt(i) === '<') isTag = true;
                        if (html.charAt(i) === '>') isTag = false;
                        
                        i++;
                        
                        if (isTag) {
                            typeChar(); // instantly add tag chars
                        } else {
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                            setTimeout(typeChar, speed);
                        }
                    } else {
                        element.innerHTML = currentHTML; // remove cursor
                        resolve();
                    }
                }
                typeChar();
            });
        }

        function showTyping() {
            const bubble = document.createElement('div');
            bubble.className = `bubble bubble-ai typing-indicator opacity-0`;
            bubble.innerHTML = `
                <div class="flex items-center h-6">
                    <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            gsap.to(bubble, { opacity: 1, duration: 0.3 });
            return bubble;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            const imageAttached = currentImageBase64;
            
            if (!text && !imageAttached) return;
            
            // Play user send sound
            playSound('click');

            // Add user message to UI
            let userExtra = '';
            if (imageAttached) {
                userExtra = `<br><img src="${imageAttached}" class="mt-2 rounded-xl border border-white/20 w-32 h-32 object-cover">`;
            }
            appendBubbleStatic(text, true, userExtra);
            saveToHistory(text, 'user', imageAttached);
            
            // Reset input
            chatInput.value = '';
            currentImageBase64 = null;
            document.getElementById('image-preview').classList.add('hidden');
            document.getElementById('image-preview').src = '';
            
            const typing = showTyping();
            
            const height = localStorage.getItem('aura_height') || '178 cm';
            const weight = localStorage.getItem('aura_weight') || '72 kg';
            
            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text,
                        image: imageAttached,
                        metrics: { height, weight }
                    })
                });
                
                const data = await response.json();
                typing.remove();
                
                // Play AI chime sound
                playSound('chime');
                
                // Create AI bubble
                const aiBubble = document.createElement('div');
                aiBubble.className = "bubble bubble-ai";
                
                let headerContent = `
                    <div class="flex items-center gap-3 border-b border-white/10 pb-2 mb-2">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-[var(--neon-cyan)] to-[var(--neon-violet)] flex items-center justify-center font-bold text-black text-xs">AI</div>
                        <span class="font-semibold">AUЯA System</span>
                    </div>
                `;
                
                let formattedReply = data.reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                formattedReply = formattedReply.replace(/\n/g, '<br>');
                
                chatContainer.appendChild(aiBubble);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                
                // Stream text
                await typeHTML(aiBubble, headerContent + `<p>${formattedReply}</p>`);
                
                // Store the full reply for the visualize button to use
                const replyId = 'reply_' + Date.now();
                window[replyId] = data.reply;
                
                // Add Visualize Button — passes a stored reference, not a mangled string
                const visualizeBtnHtml = `<div class="mt-4 border-t border-white/10 pt-3"><button onclick="visualizeOutfit('${replyId}', this)" class="text-xs font-semibold bg-white/5 hover:bg-white/10 border border-[var(--neon-cyan)]/50 rounded-full px-4 py-2 transition flex items-center gap-2 cursor-none">✨ Visualize Look</button></div>`;
                
                aiBubble.innerHTML += visualizeBtnHtml;
                bindCursorHover();
                
                saveToHistory(data.reply, 'ai');
                
            } catch (error) {
                console.error('Frontend Fetch Error:', error);
                typing.remove();
                appendBubbleStatic("Connection error: Cannot reach the AUЯA server.", false);
            }
        });
    </script>
</body>
</html>
