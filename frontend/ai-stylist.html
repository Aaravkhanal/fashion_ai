<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUЯA® | AI Stylist</title>
    <meta name="description" content="Consult your personal AI fashion stylist for curated outfit recommendations.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="global.css">
    <style>
        body { background: #1A1A1A; }
        .chat-area { max-width: 800px; margin: 0 auto; width: 100%; }

        .bubble {
            padding: 2rem; max-width: 85%;
            font-size: 14px; line-height: 1.8;
            position: relative; margin-bottom: 2rem;
            opacity: 0; transform: translateY(20px);
        }

        .bubble-ai {
            background: rgba(26,26,26,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--white);
            border-left: 2px solid var(--gold);
            border: 1px solid rgba(255,255,255,0.06);
            border-left: 2px solid var(--gold);
        }

        .bubble-user {
            background: rgba(212,175,55,0.12);
            color: var(--white);
            border: 1px solid rgba(212,175,55,0.3);
            margin-left: auto;
        }

        .input-bar {
            background: rgba(26,26,26,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            display: flex; align-items: center; gap: 1rem;
            border: 1px solid var(--border-gold);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }

        .input-bar input[type="text"] {
            background: transparent;
            color: var(--white);
            width: 100%; outline: none;
            font-size: 14px; padding: 0.5rem;
            font-family: 'Inter', sans-serif;
        }
        .input-bar input::placeholder { color: var(--text-muted); }

        .gold-thread {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            background-size: 200% 100%;
            animation: thread 1.5s infinite linear;
            width: 60px;
            margin: 8px 0;
        }
        @keyframes thread {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }
    </style>
</head>
<body class="antialiased flex flex-col h-screen">

    <header id="main-header" class="scrolled">
        <a href="index.html" class="logo">AUЯA<span>®</span></a>
        <div class="nav-links ml-auto mr-12">
            <a href="index.html#men">Men</a>
            <a href="index.html#women">Women</a>
            <a href="index.html#junior">Kids</a>
        </div>
        <button class="gold-link" onclick="localStorage.removeItem('aura_chat_history'); location.reload();">Clear Chat</button>
    </header>

    <main class="flex-1 overflow-y-auto pt-32 pb-40 px-8" id="chat-container">
        <div class="chat-area" id="chat-list">
            <div class="bubble bubble-ai" style="opacity: 1; transform: none;">
                <p class="font-bold serif text-xl mb-4 text-[#D4AF37]">AUЯA® AI</p>
                <p>Welcome to the atelier. Describe your desired aesthetic, or upload an image to begin curation.</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 w-full z-50">
        <!-- Preview container -->
        <div id="image-preview-container" class="hidden absolute bottom-full left-1/2 -translate-x-1/2 mb-4 p-2 border border-[#D4AF37]/40 bg-[#1A1A1A]">
            <img id="image-preview" class="w-32 h-32 object-cover">
        </div>

        <form id="chat-form" class="input-bar max-w-4xl mx-auto mb-8 relative">
            <label class="cursor-pointer text-2xl opacity-40 hover:opacity-100 transition text-[#D4AF37]">
                +
                <input type="file" id="image-upload" accept="image/*" class="hidden">
            </label>
            <input type="text" id="chat-input" placeholder="Consult the AI stylist...">
            <button type="submit" class="text-[10px] uppercase tracking-widest font-bold text-[#D4AF37] hover:text-white transition">Send</button>
        </form>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatList = document.getElementById('chat-list');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        let savedHistory = JSON.parse(localStorage.getItem('aura_chat_history') || '[]');
        let currentImageBase64 = null;

        // Load History
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
            if (savedHistory.length > 0) {
                chatList.innerHTML = '';
                savedHistory.forEach(msg => appendBubble(msg.text, msg.role === 'user', msg.image, false));
            }
        });

        // Image Upload Handle
        document.getElementById('image-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                currentImageBase64 = event.target.result;
                document.getElementById('image-preview').src = currentImageBase64;
                document.getElementById('image-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        });

        function appendBubble(text, isUser, imageBase64, animate = true) {
            const el = document.createElement('div');
            el.className = `bubble ${isUser ? 'bubble-user' : 'bubble-ai'}`;

            let html = '';
            if (!isUser) html += `<p class="font-bold serif text-xl mb-4 text-[#D4AF37]">AUЯA® AI</p>`;
            if (imageBase64) html += `<img src="${imageBase64}" class="w-48 h-48 object-cover mb-4 border border-[#D4AF37]/20">`;

            html += `<p>${text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>')}</p>`;

            if (!isUser && animate) {
                // Remove bold markup or similar simple things to make a clean query
                const cleanQuery = text.replace(/<[^>]*>?/gm, '').replace(/\\*/g, '');
                html += `<button onclick="window.location.href='fitting-room.html?style=' + encodeURIComponent('${cleanQuery.replace(/'/g, "\\'")}')" class="mt-6 gold-link inline-block">Try this in Mirror →</button>`;
            }

            el.innerHTML = html;
            chatList.appendChild(el);

            if (animate) {
                gsap.to(el, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" });
            } else {
                el.style.opacity = 1;
                el.style.transform = 'none';
            }

            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            return el;
        }

        function showTyping() {
            const el = document.createElement('div');
            el.className = `bubble bubble-ai`;
            el.innerHTML = `<div class="flex items-center pt-2"><div class="gold-thread"></div></div>`;
            chatList.appendChild(el);
            gsap.to(el, { opacity: 1, y: 0, duration: 0.3 });
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            return el;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            const img = currentImageBase64;

            if (!text && !img) return;

            appendBubble(text, true, img);
            savedHistory.push({ text, role: 'user', image: img });
            localStorage.setItem('aura_chat_history', JSON.stringify(savedHistory));

            chatInput.value = '';
            currentImageBase64 = null;
            document.getElementById('image-preview-container').classList.add('hidden');

            const typing = showTyping();

            try {
                const response = await fetch('http://localhost:3000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, image: img, history: savedHistory })
                });

                const data = await response.json();
                typing.remove();

                appendBubble(data.reply, false, null);
                savedHistory.push({ text: data.reply, role: 'ai' });
                localStorage.setItem('aura_chat_history', JSON.stringify(savedHistory));

            } catch (err) {
                typing.remove();
                appendBubble("Neural net disconnected. Try again.", false, null);
            }
        });
    </script>
</body>
</html>
